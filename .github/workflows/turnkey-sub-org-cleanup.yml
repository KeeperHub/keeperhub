# Type: manual | Deletes Turnkey sub-orgs that the e2e suites created with the
# Turnkey key of the `staging` environment and left behind when their
# ephemeral database was dropped. Dry run by default. See the header of
# scripts/turnkey/cleanup-orphaned-sub-orgs.ts for the selection rules.
name: turnkey-sub-org-cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reports only; delete removes sub-orgs"
        type: choice
        options: [dry-run, delete]
        default: dry-run
      expected_key_prefix:
        description: "First 16+ hex characters of the Turnkey API public key this job must run with"
        type: string
        required: true
      max_sub_orgs:
        description: "dry-run: sub-orgs to inspect; delete: sub-orgs to delete"
        type: string
        default: "1"
      min_age_hours:
        description: "Skip sub-orgs younger than this many hours"
        type: string
        default: "6"
      requests_per_second:
        description: "Turnkey request rate (max 30)"
        type: string
        default: "10"
      exclude_sub_org_ids:
        description: "Comma separated sub-org ids to keep"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: turnkey-sub-org-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # No version input: the version comes from the packageManager field in
        # package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean up sub-orgs
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_KEY_PREFIX: ${{ inputs.expected_key_prefix }}
          MAX_SUB_ORGS: ${{ inputs.max_sub_orgs }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours }}
          REQUESTS_PER_SECOND: ${{ inputs.requests_per_second }}
          EXCLUDE_SUB_ORG_IDS: ${{ inputs.exclude_sub_org_ids }}
          TURNKEY_API_PUBLIC_KEY: ${{ secrets.TURNKEY_API_PUBLIC_KEY }}
          TURNKEY_API_PRIVATE_KEY: ${{ secrets.TURNKEY_API_PRIVATE_KEY }}
          TURNKEY_ORGANIZATION_ID: ${{ secrets.TURNKEY_ORGANIZATION_ID }}
          CHAIN_RPC_CONFIG: ${{ secrets.CHAIN_RPC_CONFIG }}
        run: pnpm tsx scripts/turnkey/cleanup-orphaned-sub-orgs.ts
