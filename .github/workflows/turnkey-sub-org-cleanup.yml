# Type: nightly + manual | Deletes Turnkey sub-orgs that the e2e suites created
# with the Turnkey key of the `staging` environment and left behind when their
# ephemeral database was dropped. The nightly run deletes up to 1000; a manual
# run is a dry run by default. See the header of
# scripts/turnkey/cleanup-orphaned-sub-orgs.ts for the selection rules.
#
# The key prefix guard and the sub-orgs to keep come from `staging`
# environment variables TURNKEY_CLEANUP_KEY_PREFIX and
# TURNKEY_CLEANUP_EXCLUDE_SUB_ORG_IDS. A manual run may replace the key prefix
# and may add sub-orgs to keep, but can never drop one from the variable.
name: turnkey-sub-org-cleanup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reports only; delete removes sub-orgs"
        type: choice
        options: [dry-run, delete]
        default: dry-run
      expected_key_prefix:
        description: "First 16+ hex characters of the Turnkey API public key this job must run with (default: TURNKEY_CLEANUP_KEY_PREFIX)"
        type: string
        default: ""
      max_sub_orgs:
        description: "dry-run: sub-orgs to inspect; delete: sub-orgs to delete"
        type: string
        default: "1"
      min_age_hours:
        description: "Skip sub-orgs younger than this many hours"
        type: string
        default: "6"
      requests_per_second:
        description: "Turnkey request rate (max 30)"
        type: string
        default: "10"
      exclude_sub_org_ids:
        description: "Comma separated sub-org ids to keep, added to TURNKEY_CLEANUP_EXCLUDE_SUB_ORG_IDS"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: turnkey-sub-org-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # No version input: the version comes from the packageManager field in
        # package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without the exclusion list the job would delete sub-orgs that a
      # database still uses, so a missing variable stops the run. The key
      # prefix may come from the input instead.
      - name: Require cleanup settings
        env:
          KEY_PREFIX: ${{ inputs.expected_key_prefix || vars.TURNKEY_CLEANUP_KEY_PREFIX }}
          EXCLUDE_IDS: ${{ vars.TURNKEY_CLEANUP_EXCLUDE_SUB_ORG_IDS }}
        run: |
          if [ -z "$KEY_PREFIX" ]; then
            echo "::error::Pass expected_key_prefix or set TURNKEY_CLEANUP_KEY_PREFIX on the staging environment"
            exit 1
          fi
          if [ -z "$EXCLUDE_IDS" ]; then
            echo "::error::Set TURNKEY_CLEANUP_EXCLUDE_SUB_ORG_IDS on the staging environment"
            exit 1
          fi

      - name: Clean up sub-orgs
        env:
          MODE: ${{ github.event_name == 'schedule' && 'delete' || inputs.mode }}
          EXPECTED_KEY_PREFIX: ${{ inputs.expected_key_prefix || vars.TURNKEY_CLEANUP_KEY_PREFIX }}
          MAX_SUB_ORGS: ${{ github.event_name == 'schedule' && '1000' || inputs.max_sub_orgs }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '6' }}
          REQUESTS_PER_SECOND: ${{ inputs.requests_per_second || '10' }}
          EXCLUDE_SUB_ORG_IDS: ${{ format('{0},{1}', vars.TURNKEY_CLEANUP_EXCLUDE_SUB_ORG_IDS, inputs.exclude_sub_org_ids) }}
          TURNKEY_API_PUBLIC_KEY: ${{ secrets.TURNKEY_API_PUBLIC_KEY }}
          TURNKEY_API_PRIVATE_KEY: ${{ secrets.TURNKEY_API_PRIVATE_KEY }}
          TURNKEY_ORGANIZATION_ID: ${{ secrets.TURNKEY_ORGANIZATION_ID }}
          CHAIN_RPC_CONFIG: ${{ secrets.CHAIN_RPC_CONFIG }}
        run: pnpm tsx scripts/turnkey/cleanup-orphaned-sub-orgs.ts
