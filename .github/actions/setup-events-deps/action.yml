name: Setup events workspace deps
description: Install Node, pnpm, and dependencies for the keeperhub-events pnpm workspace.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Setup pnpm
      # Version comes from the packageManager field in this package's own
      # package.json, not the repo root: this project pins a different pnpm
      # than the main app. pnpm hashes patched dependencies differently across
      # majors and validates the hash on a frozen install, so CI, the Docker
      # images and local installs all have to agree.
      uses: pnpm/action-setup@v4
      with:
        package_json_file: keeperhub-events/package.json

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v5
      with:
        path: ${{ env.STORE_PATH }}
        # Key only on the events lockfile so main-app lockfile churn does
        # not invalidate the events cache.
        key: ${{ runner.os }}-pnpm-events-${{ hashFiles('keeperhub-events/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-events-

    - name: Install events deps
      shell: bash
      working-directory: keeperhub-events
      run: pnpm install --frozen-lockfile
