name: Setup Node.js + pnpm
description: Install Node.js, pnpm, dependencies, and optionally Playwright browsers

inputs:
  install-playwright:
    description: Install and cache Playwright Chromium browsers
    required: false
    default: "false"
  discover-plugins:
    description: Run pnpm discover-plugins after install
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Setup pnpm
      # No version input: pnpm/action-setup resolves the exact version from
      # the packageManager field in the root package.json, and errors if both
      # are set. Pinning in one place keeps CI and local installs on the same
      # pnpm major, which patchedDependencies hashes depend on.
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v5
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate plugin registry
      if: inputs.discover-plugins == 'true'
      shell: bash
      run: pnpm discover-plugins

    - name: Get Playwright version
      if: inputs.install-playwright == 'true'
      shell: bash
      run: echo "PW_VERSION=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_ENV

    - name: Cache Playwright browsers
      if: inputs.install-playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Playwright system deps
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
