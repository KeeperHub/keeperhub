version: 2
# Sub-services with their own lockfiles need explicit entries.
# keeperhub-executor has no lockfile (part of root workspace) so "/" covers it.
# Groups are split by applies-to. The security-patches group bundles routine
# security minor and patch updates (e.g. a transitive dompurify 3.3.x to 3.4.0
# bump) into one weekly PR. Security majors and any version-update majors fall
# outside the group and open as individual PRs, which preserves an accurate
# one-bump-one-title relationship for the higher-risk changes.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # better-auth is held at 1.7.2 by the pin documented in package.json
      # (overrides_better_auth_comment): 1.7.3 stopped writing accounts.issuer,
      # which KEEP-1311 made NOT NULL, so every credential signup fails on the
      # insert. The pin lives in both the dependency and the overrides block,
      # and a group bump raised both at once (#2592, KEEP-1374) - the comment
      # is not something Dependabot reads. Ignoring the package here is what
      # actually holds the pin. Note this also suppresses security updates for
      # better-auth; Dependabot alerts still fire, so a CVE is still visible,
      # it just will not open its own PR. Remove together with KEEP-1312.
      - dependency-name: "better-auth"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/keeperhub-events"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/keeperhub-scheduler"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    # docs-site/.npmrc sets minimum-release-age=4320, which is 3 days, and lists
    # no exclusions. docs-site/package.json pins next to an exact version, so a
    # bump to a release younger than the gate leaves no version that satisfies
    # the range. pnpm then fails the lockfile step outright:
    #
    #   ERR_PNPM_NO_MATURE_MATCHING_VERSION  Version 16.3.3 (released 21 hours
    #   ago) of next does not meet the minimumReleaseAge constraint
    #
    # Dependabot ships the manifest edit alone when its lockfile step fails, and
    # the docs image installs with --frozen-lockfile, so the build breaks. This
    # cooldown holds a version back for the same 3 days the gate wants, so the
    # two agree and Dependabot never proposes a release pnpm will refuse.
    # default-days also supplies the major, minor and patch values, which are
    # left unset here on purpose.
    #
    # Cooldown covers version updates only. A security update can still propose
    # a release younger than 3 days and hit the gate.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "staging"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
