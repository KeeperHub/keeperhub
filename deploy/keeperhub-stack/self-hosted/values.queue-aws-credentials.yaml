# Static AWS credentials for a real SQS queue, merged only when you supply them
# and only when QUEUE_MODE=byo with no AWS_ENDPOINT_URL.
#
# Why this exists at all. Staging and production authenticate with IRSA, which
# needs an EKS cluster with an OIDC provider and an IAM role that trusts it. A
# self-hosted cluster has none of that, so an operator who wants real AWS SQS had
# no supported way to authenticate. That is a real gap for an on-prem install,
# not test scaffolding.
#
# It works without touching application code because of how the SDK clients are
# built: all three construction sites set explicit credentials ONLY when an
# endpoint is configured, and otherwise fall through to the default credential
# provider chain. That chain reads exactly these three variables. So supplying
# them is enough, and AWS_SESSION_TOKEN means temporary credentials from an
# assumed role work too, not just long-lived keys.
#
# type: secret, never type: kv. These are real credentials and must not be
# written into a values file, which is committed and shows up in `helm get
# values`. install.sh creates the Secret from the environment; for a plain helm
# install, create it yourself before installing.
#
# Prefer IRSA where you have it. Prefer temporary credentials over long-lived
# keys where you do not.
global:
  queue:
    # The Secret holding real AWS credentials. Created by install.sh from the
    # values you pass it, or by you before a plain helm install.
    credentialsSecretName: keeperhub-aws-credentials

app:
  env:
    AWS_ACCESS_KEY_ID:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_SECRET_ACCESS_KEY
    AWS_SESSION_TOKEN:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_SESSION_TOKEN

executor:
  env:
    AWS_ACCESS_KEY_ID:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_SECRET_ACCESS_KEY
    AWS_SESSION_TOKEN:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_SESSION_TOKEN

schedule:
  env:
    AWS_ACCESS_KEY_ID:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_SECRET_ACCESS_KEY
    AWS_SESSION_TOKEN:
      type: secret
      name: '{{ .Values.global.queue.credentialsSecretName }}'
      key: AWS_SESSION_TOKEN
