# DB_MODE=bundled - the chart runs PostgreSQL as a CloudNativePG Cluster, which
# brings HA, failover, backup and restore with it.
#
# No env here. The connection string is read from a Secret in both modes (see
# values.yaml); in this mode the installer composes it from the credentials
# below and creates that Secret. Deliberately not CloudNativePG's own generated
# Secret: its `uri` and `fqdn-uri` keys use hosts that do not end
# .svc.cluster.local, so the application forces sslmode=verify-full and then
# fails TLS against the in-cluster certificate.
postgresql:
  bundled: true
  nameOverride: "${PG_NAME}"
  instances: ${PG_INSTANCES}
  database: "${PG_DATABASE}"
  owner: "${PG_USER}"
  credentialsSecret: "${PG_CREDENTIALS_SECRET}"
  storage:
    size: ${PG_STORAGE_SIZE}
  # CloudNativePG creates an owner, not a superuser, and the upstream test
  # harness sets session_replication_role to 'replica' so it can delete users
  # without tripping the append-only trigger on security_audit_log. Without this
  # grant, two of the three call sites run in Playwright globalSetup, so the
  # whole run aborts before a single test executes.
  #
  # This is not the escalation it looks like. The owner already owns every table
  # and can ALTER TABLE ... DISABLE TRIGGER, so it can bypass that guard today.
  # Granting the one parameter adds no capability; it only makes the supported
  # route work. Remove the entry if you would rather it fail closed.
  grantSetOnParameters:
    - session_replication_role
