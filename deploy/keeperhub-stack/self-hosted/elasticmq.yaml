# ElasticMQ - the SQS-compatible queue for a self-hosted install.
#
# Replaces LocalStack, which needs a paid auth token on current images, is
# ephemeral unless you pay for persistence, and whose free Community Edition is
# being retired. ElasticMQ is Apache-2.0, needs no token, and speaks enough of
# the SQS API for everything KeeperHub uses. No application code changes: the
# same @aws-sdk/client-sqs talks to it via AWS_ENDPOINT_URL.
#
# Verified against @aws-sdk/client-sqs 3.1025.0 on elasticmq-native 1.6.16:
# SendMessage / ReceiveMessage (long poll 20s, batch of 10, per-request
# visibility timeout) / DeleteMessage / GetQueueUrl / GetQueueAttributes, the
# five String MessageAttributes including the hyphenated X-KH-* signature
# attributes, and redelivery after the visibility timeout expires.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticmq-conf
  namespace: ${NAMESPACE}
data:
  elasticmq.conf: |
    include classpath("application.conf")

    # Determines the URLs ElasticMQ RETURNS from CreateQueue, GetQueueUrl and
    # ListQueues. It is set to the in-cluster Service DNS so those responses are
    # byte-identical to the SQS_QUEUE_URL every component is configured with in
    # config.sh.
    #
    # This matters more than it looks. The queue URL is bound into the HMAC
    # signing string (lib/sqs-message-auth.ts), and the executor verifies each
    # message against its own configured URL. If ElasticMQ advertised a
    # different string than the one components sign with, an operator debugging
    # with 'aws sqs get-queue-url' would be handed a URL that silently fails
    # verification. ElasticMQ itself resolves the queue from the last path
    # segment and ignores the host, so requests still work either way - which is
    # exactly what makes the mismatch hard to spot.
    node-address {
      protocol = http
      host = "elasticmq.${NAMESPACE}.svc.cluster.local"
      port = 9324
      context-path = ""
    }
    generate-node-address = false

    rest-sqs {
      enabled = true
      bind-port = 9324
      bind-hostname = "0.0.0.0"
      # strict, not relaxed: a message real SQS would reject must be rejected
      # here too, or the local stack stops predicting production behaviour.
      sqs-limits = strict
    }

    aws {
      region = us-east-1
      accountId = 000000000000
    }

    # Queues are declared statically rather than created by an API call after
    # startup. The queue then exists the moment the port is open, so readiness
    # means queue-ready with no init container and no race, the attributes are
    # reviewable in git instead of being an argv fragment, and a pod restart
    # restores identical state.
    queues {
      keeperhub-workflow-queue {
        # Matches the executor's CONFIG.visibilityTimeout. The executor also
        # passes VisibilityTimeout per receive; this is the queue default so an
        # ad-hoc 'aws sqs receive-message' behaves the same way.
        defaultVisibilityTimeout = 300 seconds
        delay = 0 seconds
        # Clients pass WaitTimeSeconds per request, so this default is unused.
        # Left at 0 so manual CLI polls return immediately.
        receiveMessageWait = 0 seconds
        fifo = false
        contentBasedDeduplication = false
        # Deliberately no deadLettersQueue redrive policy. The executor rejects
        # redrive by design: it deletes a bad message on first receive, so the
        # message never reaches maxReceiveCount. It copies rejects to the DLQ
        # itself with SendMessage, carrying an X-KH-Reason attribute.
      }
      keeperhub-workflow-queue-dlq {
        defaultVisibilityTimeout = 300 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        fifo = false
        contentBasedDeduplication = false
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: ${NAMESPACE}
  labels:
    app: elasticmq
spec:
  replicas: 1
  # Single in-memory queue owner; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.6.16
          ports:
            - name: sqs
              containerPort: 9324
            - name: stats
              containerPort: 9325
          volumeMounts:
            - name: conf
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # The statistics server lists the live queues, so a 200 here proves
          # the queues were actually declared, not merely that the port opened.
          startupProbe:
            httpGet:
              path: /statistics/queues
              port: 9325
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /statistics/queues
              port: 9325
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9324
            periodSeconds: 15
      volumes:
        - name: conf
          configMap:
            name: elasticmq-conf
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: ${NAMESPACE}
  labels:
    app: elasticmq
spec:
  type: ClusterIP
  selector:
    app: elasticmq
  ports:
    - name: sqs
      port: 9324
      targetPort: 9324
    - name: stats
      port: 9325
      targetPort: 9325
