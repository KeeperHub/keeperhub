# keeperhub-stack umbrella values - self-hosted
#
# A peer of staging/values.yaml and prod/values.yaml, deliberately the same
# chart and the same structure. Diff this against staging/values.yaml whenever
# you change either: this profile is only trustworthy while it stays
# structurally identical to what staging and prod actually run.
#
# This is the only AWS-free path in the repo. No parameterStore entry, no role
# ARN, no ECR reference and no Cloudflare annotation, so it renders on a stock
# cluster with no External Secrets Operator, no IRSA and no Cloudflare. That
# property is load-bearing; keep it.
#
# This file is valid Helm input on its own:
#
#   helm install keeperhub techops-services/keeperhub-stack --version 0.5.0 \
#     --namespace keeperhub --create-namespace \
#     -f values.yaml -f values.db-bundled.yaml -f values.queue-bundled.yaml \
#     -f my-install.yaml
#
# It used to carry ${VAR} placeholders that install.sh resolved with envsubst,
# which meant helm could not read it: helm treats ${VAR} as literal text, so the
# install did not fail, it produced a broken release. Everything a client sets is
# now under `global:` below, and every place that consumes one of those values is
# declared `type: template`, which the chart renders through tpl. Set them in your
# own file and pass it last.
#
# `{{ .Release.Namespace }}` is used directly wherever the namespace is needed, so
# there is nothing to keep in step with `--namespace`.
#
# This is not the whole picture. Two more files merge over this one,
# values.db-<mode>.yaml and values.queue-<mode>.yaml, which is how the database
# and the queue can each be bundled by the chart or brought by the operator. The
# queue endpoint and its static credentials live in those fragments rather than
# here, because bring-your-own needs them ABSENT and a later -f cannot delete a
# key.
#
# The defaults here suit a real cluster. values.minikube.yaml overlays the ones
# that only make sense on a laptop; the test harness applies it.
#
# No secret material appears in this file. Secrets are plain Kubernetes Secrets,
# generated by the chart when secrets.generate is on, and referenced here with
# `type: secret`. Without External Secrets, that is the mechanism a no-AWS
# install uses.

# ---------------------------------------------------------------------------
# Everything a client sets. Helm merges this map into every component, so each
# value is written once here and read by all of them.
# ---------------------------------------------------------------------------
global:
  image:
    # Required. No default is offered on purpose: a placeholder that installs and
    # then cannot pull is worse than a render that stops and says which value is
    # missing.
    repository: ""
    # Required. The tag is a bare version; each component appends its own prefix,
    # so tag "v1.4.0" resolves to app-v1.4.0, executor-v1.4.0 and so on.
    tag: ""
    pullPolicy: IfNotPresent

  # Required. The hostname the application is served on. Used by the Ingress, the
  # TLS certificate and the three URLs the application builds links from, which is
  # why it is one value rather than four copies.
  appHost: ""

  ingressClassName: nginx

  # A cert-manager ClusterIssuer. The chart's certificate template emits
  # issuerRef.kind: ClusterIssuer unconditionally, so a namespaced Issuer does not
  # work here. Set app.service.tls.enabled to false if you terminate TLS elsewhere.
  tlsIssuer: ""

  # Required by the SQS SDK even when it talks to ElasticMQ rather than AWS.
  awsRegion: us-east-1

  # The From address on verification codes, invitations and password resets. It
  # must be a sender identity verified in the SendGrid account whose key this
  # install uses, or every send is rejected with 403.
  fromAddress: ""

  # Where the connection string lives. In bundled mode the chart writes this
  # Secret; in bring-your-own mode you create it and name it here.
  db:
    secretName: keeperhub-db
    secretKey: DATABASE_URL

  # Cloudflare Turnstile. lib/auth.ts throws at module load when the captcha is
  # required and this is absent, and because the whole auth module then fails to
  # evaluate, every route that transitively imports it returns 500 - including
  # /api/internal/schedules, which the schedule dispatcher polls. The symptom is a
  # dispatcher logging a 500 every minute and no workflow ever firing, with all
  # pods green.
  #
  # Read at runtime, so setting it here works. Its partner
  # NEXT_PUBLIC_TURNSTILE_SITE_KEY is read by a client component, so Next.js
  # inlines it into the browser bundle at build time and a value set here is
  # silently ignored - pass that one as a build arg.
  #
  # No default. Cloudflare publishes an always-pass test key, and defaulting to it
  # would ship an install whose captcha is disabled without anyone choosing that.
  # values.minikube.yaml sets it, because there it is the right answer.
  turnstileSecretKey: ""

# ---------------------------------------------------------------------------
# Chart-owned pieces a self-hosted install wants and staging does not.
# ---------------------------------------------------------------------------

# Generate the install secrets rather than requiring a secret manager. Read the
# chart README before relying on it: the "keep what is installed" step uses
# `lookup`, which is empty under `helm template`, so a
# `helm template | kubectl apply` pipeline rotates these keys on every run.
secrets:
  generate: true

# Runner Job pods need this account to exist. The executor creates the Jobs
# through the Kubernetes API and stamps the name into them, so nothing else
# creates it. Staging and production render it from their own manifest instead.
runnerServiceAccount:
  create: true

app:
  enabled: true

  # Anchored here and reused by the db-migration initContainer below, mirroring
  # the shape staging uses.
  shared_env: &shared_env
    # Always a Secret reference, in both modes.
    #
    # In bundled mode the chart composes it from the CloudNativePG credentials
    # it generated and writes this Secret; in bring-your-own mode you create it.
    # Keeping one shape for both means the db-migration initContainer inherits
    # it through the shared_env anchor, which a later -f could not reach: an
    # anchor is expanded when its own file is parsed, so a values fragment
    # cannot extend it.
    DATABASE_URL:
      type: secret
      name: '{{ .Values.global.db.secretName }}'
      key: '{{ .Values.global.db.secretKey }}'
    WORKFLOW_POSTGRES_URL:
      type: secret
      name: '{{ .Values.global.db.secretName }}'
      key: '{{ .Values.global.db.secretKey }}'
    # ensureExplicitSslMode deliberately no-ops for *.svc.cluster.local, so no
    # sslmode and no NODE_EXTRA_CA_CERTS/RDS CA bundle are needed here. That is
    # the one place local legitimately differs from staging.
    INTERNAL_SERVICE_HMAC_SECRET:
      type: secret
      name: keeperhub-shared
      key: INTERNAL_SERVICE_HMAC_SECRET
    AGENTIC_WALLET_HMAC_KMS_KEY:
      type: secret
      name: keeperhub-shared
      key: AGENTIC_WALLET_HMAC_KMS_KEY
    # Name and key match what the executor hands to runner Job pods via
    # secretKeyRef, so the app and the runner decrypt with the same key.
    INTEGRATION_ENCRYPTION_KEY:
      type: secret
      name: keeperhub-executor-integration-encryption-key
      key: keeperhub-executor-integration-encryption-key
    AWS_REGION:
      type: template
      value: '{{ .Values.global.awsRegion }}'
    # Set for the same reason staging sets them. The Code plugin throws at
    # module load when NODE_ENV is "production" unless both are present, and the
    # plugin registry imports it eagerly. Both are required, not precautionary:
    # Next.js inlines process.env.NODE_ENV at build time, so the compiled app
    # takes the "production" branch whatever NODE_ENV says at runtime. See the
    # NODE_ENV entry below for the same trap in lib/auth.ts.
    SANDBOX_BACKEND:
      type: kv
      value: "remote"
    SANDBOX_URL:
      type: template
      value: 'http://keeperhub-sandbox.{{ .Release.Namespace }}.svc.cluster.local:8787'
    # In shared_env specifically because the db-migration initContainer needs
    # it. scripts/seed/seed-chains.ts calls getWssUrl and writes the result into
    # the chains table, so a value that arrives after the install is too late:
    # the columns are already empty and the dispatchers connect to nothing.
    #
    # install.sh always creates this Secret key, empty when unset. Empty is safe
    # to read - parseRpcConfig evaluates `envValue || "{}"` and falls through to
    # the public RPC defaults - whereas an absent key would leave every pod in
    # CreateContainerConfigError.
    #
    # This is also the ONLY way to configure a websocket endpoint. The per-chain
    # CHAIN_<NAME>_PRIMARY_RPC variables are HTTP-only; ChainConfigEntry in
    # lib/rpc/rpc-config.ts has no websocket field. The Block and Event triggers
    # both need one, and only the Tempo chains ship a public default.
    CHAIN_RPC_CONFIG:
      type: secret
      name: keeperhub-integrations
      key: CHAIN_RPC_CONFIG

  replicaCount: 1

  image:
    repository: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}'
    tag: 'app-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
    pullPolicy: '{{ .Values.global.image.pullPolicy }}'

  service:
    enabled: true
    name: keeperhub-app
    port: 3000
    type: ClusterIP
    containerPort: 3000
    tls:
      enabled: true
      # The common chart's certificate template emits issuerRef.kind:
      # ClusterIssuer unconditionally, so a namespaced Issuer does not work here.
      # Set service.tls.enabled to false if you terminate TLS elsewhere.
      issuerName: '{{ required "set global.tlsIssuer - a cert-manager ClusterIssuer - or disable app.service.tls" .Values.global.tlsIssuer }}'

  # The chart owns the Ingress, so it is inside helm --atomic with everything
  # else rather than being applied separately and kept in sync by hand.
  ingressClassName: '{{ .Values.global.ingressClassName }}'
  ingress:
    enabled: true
    hosts:
      - '{{ required "set global.appHost - the hostname the application is served on" .Values.global.appHost }}'
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "16m"

  httpWwwRedirect:
    enabled: false
  httpBasicAuth:
    enabled: false

  deployment:
    enabled: true
    initContainers:
      # Helm does not track the CloudNativePG Cluster's readiness - it is a CR
      # reconciled by an operator, not a workload, so --wait sees nothing to wait
      # for. Without this the migration starts against a database that is still
      # bootstrapping, fails, and --atomic rolls the whole release back.
      #
      # Uses the migrator image and the application's own driver rather than
      # pulling a postgres client: the image is already being pulled for the next
      # step, and a real query proves the database is accepting queries, not just
      # that a port is open.
      - name: wait-for-db
        image: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}:migrator-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -e
            echo "Waiting for the database to accept connections..."
            i=0
            until node -e "
              const postgres = require('postgres');
              const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 5, onnotice: () => {} });
              sql.unsafe('select 1').then(() => sql.end()).catch(() => process.exit(1));
            " 2>/dev/null; do
              i=$((i + 1))
              if [ "$i" -ge 60 ]; then
                echo "Database did not become reachable within 5 minutes" >&2
                exit 1
              fi
              sleep 5
            done
            echo "Database is reachable"
        env: *shared_env
      # Mirrors staging's db-migration initContainer. No irsa-preflight: there
      # is no AWS to preflight.
      #
      # This MUST run from the migrator image. The app image (Dockerfile stage
      # "runner") carries no drizzle/, no drizzle.config.ts, no scripts/ and no
      # pnpm, so migrations cannot run from it.
      #
      # The tag is deliberately not ":latest". The common chart does not render
      # imagePullPolicy for initContainers, so kubelet applies its own default,
      # which is Always for ":latest" and IfNotPresent otherwise. A ":latest"
      # tag would make this try to pull a side-loaded image that exists only
      # inside the node.
      - name: db-migration
        image: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}:migrator-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -e
            echo "Setting up workflow postgres tables..."
            # Same line staging runs, called by path for the reason noted
            # there. The setup entrypoint parses the URL itself and does not
            # tolerate unencoded characters in the userinfo component, while
            # drizzle goes through getDatabaseUrl and is already safe. A
            # generated password is where that difference shows up.
            export WORKFLOW_POSTGRES_URL=$(tsx scripts/encode-pg-url.ts)
            node node_modules/@workflow/world-postgres/bin/setup.js
            echo "Running database migrations..."
            pnpm db:migrate
            echo "Seeding chains..."
            pnpm tsx scripts/seed/seed-chains.ts
            # Only this line tolerates failure, and only because insertHmacSecret
            # has no ON CONFLICT: re-deploying against an already-seeded database
            # legitimately throws on the unique key. Everything above is under
            # 'set -e' so a real migration failure aborts the pod and helm
            # --atomic rolls the release back, rather than leaving a
            # half-migrated database behind a healthy-looking pod.
            #
            # The message deliberately does not claim the row already exists.
            # Any failure lands here, including a malformed secret, and a
            # confident "already present" would send someone looking in the
            # wrong place: the real symptom of a missing row is the schedule
            # dispatcher getting 401 from /api/internal/schedules and scheduled
            # triggers silently never firing.
            echo "Seeding internal-service HMAC secret..."
            printf '%s' "$INTERNAL_SERVICE_HMAC_SECRET" \
              | ALLOW_REMOTE=1 pnpm tsx scripts/seed-internal-service-hmac.ts \
              || echo "internal-service HMAC seed did not write a row (see error above); if this is not a redeploy, scheduled triggers will 401"
            echo "Migrations and seeding completed successfully"
        env: *shared_env

  serviceAccount:
    create: true
    name: keeperhub-app
    # requireRoleArn and irsaCheck both default to false in the common chart, so
    # nothing IRSA-related is rendered and nothing needs disabling here.

  # Matches staging. The memory limit must exceed NODE_OPTIONS
  # --max-old-space-size by around 1 GiB to leave headroom for off-heap RSS;
  # setting them equal makes the kernel OOM-killer fire before V8 collects.
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      memory: 4Gi

  env:
    <<: *shared_env
    # Matches staging, which also runs the production image with this set.
    #
    # Be careful what you conclude from it. Next.js inlines process.env.NODE_ENV
    # into the server bundle at build time, so for anything compiled into the
    # app this reads "production" no matter what is set here - the value only
    # affects code that reads the variable at runtime. Concretely: the container
    # reports NODE_ENV=development while lib/auth.ts still takes its
    # NODE_ENV === "production" branch. Anything gated that way must be
    # satisfied with real configuration rather than by trying to declare the
    # environment non-production.
    NODE_ENV:
      type: kv
      value: "development"
    # One such gate. See global.turnstileSecretKey for what an empty value costs
    # and why its partner site key cannot be set here.
    TURNSTILE_SECRET_KEY:
      type: template
      value: '{{ .Values.global.turnstileSecretKey }}'
    LOG_LEVEL:
      type: kv
      value: "info"
    HOSTNAME:
      type: kv
      value: "0.0.0.0"
    WORKFLOW_TARGET_WORLD:
      type: kv
      value: "@workflow/world-postgres"
    # Match production exactly. Without these the DevKit falls back to its own
    # defaults, which is the one remaining difference between this stack's
    # workflow engine configuration and prod's.
    WORKFLOW_LOCAL_QUEUE_CONCURRENCY:
      type: kv
      value: "5000"
    WORKFLOW_POSTGRES_WORKER_CONCURRENCY:
      type: kv
      value: "5"
    NEXT_PUBLIC_APP_URL:
      type: template
      value: 'https://{{ required "set global.appHost - the hostname the application is served on" .Values.global.appHost }}'
    NEXT_PUBLIC_API_URL:
      type: template
      value: 'https://{{ required "set global.appHost - the hostname the application is served on" .Values.global.appHost }}'
    BETTER_AUTH_URL:
      type: template
      value: 'https://{{ required "set global.appHost - the hostname the application is served on" .Values.global.appHost }}'
    # Trusts this install's own hostname for cookie-authenticated writes.
    #
    # The application ships a fixed trusted-origin list covering localhost and
    # *.keeperhub.com. Without this entry a client domain loads and reads fine
    # and then fails every save with 403 and "[csrf] blocked: untrusted origin"
    # in the app log - which looks like the app is broken rather than
    # unconfigured. Set from the same value as the URLs above so the three
    # cannot disagree.
    #
    # global.appAliasHost is appended when the install serves a second hostname.
    # The list is comma-separated, and lib/trusted-origins.ts filters each entry
    # through isSafeOriginPattern, so an empty trailing entry is dropped rather
    # than trusted.
    ADDITIONAL_TRUSTED_ORIGINS:
      type: template
      value: 'https://{{ required "set global.appHost - the hostname the application is served on" .Values.global.appHost }}{{ if .Values.global.appAliasHost }},https://{{ .Values.global.appAliasHost }}{{ end }}'
    # Nothing is gated in a self-hosted install; this short-circuits both the
    # execution guard and the feature route-guard.
    NEXT_PUBLIC_BILLING_ENABLED:
      type: kv
      value: "false"
    METRICS_COLLECTOR:
      type: kv
      value: "prometheus"
    # Outbound email, and a required setting. SendGrid is the only supported
    # sender, so supply a key from your own account. lib/email.ts posts to
    # SendGrid's HTTP API, which means there is no SMTP setting and no local
    # mail-catcher option.
    #
    # Without a key the app still generates verification codes, invitations and
    # password resets, but sendEmail returns false and nothing is delivered, so
    # signup dead-ends at "enter the 6-digit code" with no way to obtain one.
    # install.sh refuses to install rather than let you find that out later. A
    # plain `helm install` has no such check, so supply the key under
    # secrets.values yourself when you install this file directly.
    #
    # SENDGRID_API_URL overrides where the send is posted. Set it only when your
    # egress policy forbids a direct call to SendGrid, and point it at a relay
    # that accepts SendGrid's v3 mail/send request shape.
    #
    # The chart always creates this Secret, with an empty value when no key is
    # given, and the app treats an empty key as "no email configured" and returns
    # false from sendEmail. The Secret cannot be conditional: the common chart
    # renders a bare secretKeyRef with no `optional` field, so a missing Secret
    # is CreateContainerConfigError and --atomic rolls the whole release back.
    # (The runner's own credential refs ARE optional, but those are built in code
    # by the executor rather than rendered by the chart - see the README.)
    SENDGRID_API_KEY:
      type: secret
      name: keeperhub-email
      key: SENDGRID_API_KEY
    # Must be a sender identity verified in YOUR SendGrid account, or every send
    # is rejected with 403. There is no useful default: a keeperhub.com address
    # is verified in our account, not in the one this install authenticates as.
    FROM_ADDRESS:
      type: template
      value: '{{ .Values.global.fromAddress }}'
    BETTER_AUTH_SECRET:
      type: secret
      name: keeperhub-shared
      key: BETTER_AUTH_SECRET
    OAUTH_JWT_SECRET:
      type: secret
      name: keeperhub-shared
      key: OAUTH_JWT_SECRET
    MCP_SESSION_SECRET:
      type: secret
      name: keeperhub-shared
      key: MCP_SESSION_SECRET
    TURNKEY_API_PUBLIC_KEY:
      type: secret
      name: keeperhub-shared
      key: TURNKEY_API_PUBLIC_KEY
    TURNKEY_API_PRIVATE_KEY:
      type: secret
      name: keeperhub-shared
      key: TURNKEY_API_PRIVATE_KEY
    TURNKEY_ORGANIZATION_ID:
      type: secret
      name: keeperhub-shared
      key: TURNKEY_ORGANIZATION_ID

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    tcpSocket:
      port: 3000
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    # A cold first boot waits behind the full migration set.
    failureThreshold: 30
    tcpSocket:
      port: 3000

  # Nothing scrapes locally, and rendering a ServiceMonitor without the
  # Prometheus Operator CRDs would fail the render outright.
  serviceMonitors:
    enabled: false
  cronjob:
    enabled: false

executor:
  enabled: true
  replicaCount: 1

  image:
    repository: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}'
    tag: 'executor-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
    pullPolicy: '{{ .Values.global.image.pullPolicy }}'

  service:
    enabled: true
    name: keeperhub-executor
    type: ClusterIP
    port: 3080
    containerPort: 3080
    tls:
      enabled: false
  ingress:
    enabled: false

  command: ["/bin/sh"]
  args:
    - "-c"
    - |
      echo "$(date) - [Executor] Starting..."
      tsx keeperhub-executor/index.ts

  deployment:
    enabled: true
    initContainers:
      # The executor queries the database ONCE at startup, before it binds its
      # health port, and dies if that query fails:
      #
      #   assertTurnkeyEnvForActiveWallets (keeperhub-executor/startup-checks.ts)
      #   selects from organization_wallets, and index.ts calls it before
      #   healthServer.listen(). On a database whose schema does not exist yet the
      #   query throws, the process exits 1, and the port is never bound - so the
      #   pod cannot even report why it is unhealthy.
      #
      # Migrations run in the app pod, so on a first install the executor races
      # them and loses. It recovers on the second or third restart, which is
      # noisy and looks like a real fault. This waits instead.
      #
      # It polls for exactly the table that check reads. Waiting for a broader
      # notion of "migrated" would be guesswork; this is the actual precondition.
      #
      # The tag is deliberately not ":latest". The common chart does not render
      # imagePullPolicy for initContainers, so kubelet applies its own default,
      # which is Always for ":latest" - and that would try to pull an image that
      # exists only inside the node.
      - name: wait-for-schema
        image: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}:migrator-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -e
            echo "Waiting for the database schema..."
            i=0
            until node -e "
              const postgres = require('postgres');
              const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 5, onnotice: () => {} });
              sql.unsafe(\"select to_regclass('public.organization_wallets') is not null as ready\")
                .then((r) => { if (!r[0].ready) { process.exit(1); } return sql.end(); })
                .catch(() => process.exit(1));
            " 2>/dev/null; do
              i=$((i + 1))
              if [ "$i" -ge 120 ]; then
                echo "Schema did not appear within 10 minutes." >&2
                echo "The app pod runs the migrations; check its db-migration initContainer." >&2
                exit 1
              fi
              sleep 5
            done
            echo "Schema is ready"
        env: *shared_env

  serviceAccount:
    create: true
    name: keeperhub-executor
    # EXECUTION_MODE=isolated means the executor creates one Job per execution.
    # Without these it authenticates fine and gets 403 from the API server.
    rules:
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create", "get", "list", "watch", "delete"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get"]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  env:
    DATABASE_URL:
      type: secret
      name: '{{ .Values.global.db.secretName }}'
      key: '{{ .Values.global.db.secretKey }}'
    INTERNAL_SERVICE_HMAC_SECRET:
      type: secret
      name: keeperhub-shared
      key: INTERNAL_SERVICE_HMAC_SECRET
    INTEGRATION_ENCRYPTION_KEY:
      type: secret
      name: keeperhub-executor-integration-encryption-key
      key: keeperhub-executor-integration-encryption-key

    AWS_REGION:
      type: template
      value: '{{ .Values.global.awsRegion }}'
    # enforce, not warn. Local must fail the same way production does when a
    # producer and the consumer disagree about the queue URL, and the DLQ makes
    # that failure visible instead of silent.
    SQS_HMAC_MODE:
      type: kv
      value: "enforce"

    # Per-execution Kubernetes Jobs, the same isolation model production uses.
    # This is why the local cluster runs a NetworkPolicy-enforcing CNI: without
    # a real runner pod there is nothing for an egress policy to apply to.
    EXECUTION_MODE:
      type: kv
      value: "isolated"
    RUNNER_IMAGE:
      type: template
      value: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}:workflow-runner-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
    IMAGE_PULL_POLICY:
      type: template
      value: '{{ .Values.global.image.pullPolicy }}'
    K8S_NAMESPACE:
      type: template
      value: '{{ .Release.Namespace }}'
    RUNNER_SERVICE_ACCOUNT:
      type: kv
      value: keeperhub-workflow-runner
    # The executor builds runner Secret references as
    # "<RUNNER_SECRET_PREFIX>-<slug>" with the key equal to the name, and
    # DATABASE_URL and INTEGRATION_ENCRYPTION_KEY are marked optional: false.
    # The default prefix is keeperhub-executor-common, which is the staging
    # release fullname; here the fullname is keeperhub-executor. Without this
    # override every runner pod fails with CreateContainerConfigError and, with
    # backoffLimit 0, the execution dies immediately.
    RUNNER_SECRET_PREFIX:
      type: kv
      value: keeperhub-executor
    # The knob to raise with cluster capacity. Each concurrent job is a runner
    # pod, so this is bounded by schedulable nodes rather than by the executor.
    # Staging does not set it at all and therefore runs the executor default of
    # 1; 4 is a starting point for a cluster with room, not a tuned figure.
    MAX_CONCURRENT_JOBS:
      type: kv
      value: "4"
    # The executor default. Finished runner pods are readable for this long
    # before the TTL controller removes them, so raising it is the cheapest way
    # to make a failed execution debuggable.
    JOB_TTL_SECONDS:
      type: kv
      value: "300"
    JOB_ACTIVE_DEADLINE:
      type: kv
      value: "300"

    KEEPERHUB_API_URL:
      type: kv
      value: "http://keeperhub-app:3000"
    HEALTH_PORT:
      type: kv
      value: "3080"
    METRICS_COLLECTOR:
      type: kv
      value: "console"
    WORKFLOW_RUNNER_COLLECT_MONITORING:
      type: kv
      value: "false"
    NEXT_PUBLIC_BILLING_ENABLED:
      type: kv
      value: "false"

    # Both the executor and workflow-runner images bake NODE_ENV=production, and
    # the executor transitively module-loads the Code plugin, which throws at
    # import time unless SANDBOX_BACKEND is "remote" and SANDBOX_URL is set. So
    # these are required for the executor to start at all, not just to run Code
    # nodes. No sandbox is deployed locally yet, so this address resolves to
    # nothing and a Code node fails at runtime with a connection error;
    # everything else works. Deploying deploy/keeperhub-sandbox locally is the
    # follow-up.
    SANDBOX_BACKEND:
      type: kv
      value: "remote"
    SANDBOX_URL:
      type: template
      value: 'http://keeperhub-sandbox.{{ .Release.Namespace }}.svc.cluster.local:8787'

    # assertTurnkeyEnvForActiveWallets hard-fails the pod when any organisation
    # has an active Turnkey wallet and these are unset, and its ephemeral
    # downgrade only applies to namespaces named pr-*. Empty values are fine
    # until a wallet exists. Supply real ones under secrets.values when you have
    # them.
    TURNKEY_API_PUBLIC_KEY:
      type: secret
      name: keeperhub-shared
      key: TURNKEY_API_PUBLIC_KEY
    TURNKEY_API_PRIVATE_KEY:
      type: secret
      name: keeperhub-shared
      key: TURNKEY_API_PRIVATE_KEY
    TURNKEY_ORGANIZATION_ID:
      type: secret
      name: keeperhub-shared
      key: TURNKEY_ORGANIZATION_ID

  livenessProbe:
    httpGet:
      path: /health
      port: 3080
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 3080
    initialDelaySeconds: 10
    periodSeconds: 10

  serviceMonitors:
    enabled: false
  cronjob:
    enabled: false

schedule:
  enabled: true
  # Staging runs two replicas behind Lease leader election. One is enough
  # locally, and leader election is left off so a single pod dispatches
  # immediately rather than waiting to acquire a lease.
  replicaCount: 1

  image:
    repository: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}'
    tag: 'schedule-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
    pullPolicy: '{{ .Values.global.image.pullPolicy }}'

  service:
    enabled: true
    name: keeperhub-schedule
    type: ClusterIP
    port: 3000
    containerPort: 3000
    tls:
      enabled: false
  ingress:
    enabled: false

  command: ["/bin/sh"]
  args:
    - "-c"
    - |
      echo "$(date) - [Dispatcher] Starting..."
      tsx schedule-dispatcher/index.ts

  serviceAccount:
    create: true
    name: keeperhub-schedule
    # Kept even at one replica and with leader election off, so
    # LEADER_ELECTION_ENABLED can be turned on without an RBAC change.
    rules:
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["get", "create", "update"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  env:
    KEEPERHUB_API_URL:
      type: kv
      value: "http://keeperhub-app:3000"
    # Signs HTTP calls to /api/internal/schedules, which the app verifies
    # against the database-backed internal_service_hmac_secrets store seeded by
    # the app's db-migration initContainer. This is a different mechanism from
    # the env-var-based SQS message HMAC above: if the row is missing, every
    # call returns 401 and scheduled triggers silently never fire.
    INTERNAL_SERVICE_HMAC_SECRET:
      type: secret
      name: keeperhub-shared
      key: INTERNAL_SERVICE_HMAC_SECRET
    AWS_REGION:
      type: template
      value: '{{ .Values.global.awsRegion }}'
    LEADER_ELECTION_ENABLED:
      type: kv
      value: "false"
    HEALTH_PORT:
      type: kv
      value: "3000"

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

  serviceMonitors:
    enabled: false
  cronjob:
    enabled: false

# Off by default. The block dispatcher opens websocket subscriptions to public
# RPC endpoints, which is a poor default on a laptop and reaches the network
# continuously rather than on demand. The configuration below is complete, so
# turning it on is `block.enabled: true` plus block-dispatcher in the image
# build; the acceptance profile values.minikube.yaml does exactly that.
#
# It needs no RPC configuration of its own. Chain endpoints arrive with the
# workflows it fetches from the app (keeperhub-scheduler/block-dispatcher/api-client.ts),
# which reads them from the `chains` table the migrator seeds. So the endpoints
# a client's install uses are the rows in a client's own database.
block:
  enabled: false
  replicaCount: 1

  image:
    repository: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}'
    tag: 'block-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
    pullPolicy: '{{ .Values.global.image.pullPolicy }}'

  service:
    enabled: true
    name: keeperhub-block
    type: ClusterIP
    port: 3000
    containerPort: 3000
    tls:
      enabled: false
  ingress:
    enabled: false

  command: ["/bin/sh"]
  args:
    - "-c"
    - |
      echo "$(date) - [BlockDispatcher] Starting..."
      tsx block-dispatcher/index.ts

  # Shares the dispatcher service account rather than creating a second one:
  # the schedule component already grants the Lease permissions that
  # LEADER_ELECTION_ENABLED would need, and both are the same logical producer.
  serviceAccount:
    create: false
    name: keeperhub-schedule

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  env:
    KEEPERHUB_API_URL:
      type: kv
      value: "http://keeperhub-app:3000"
    # Same database-backed HMAC store the schedule dispatcher uses. Without the
    # row, /api/internal/block-workflows returns 401 and no block trigger ever
    # fires, with every pod still green.
    INTERNAL_SERVICE_HMAC_SECRET:
      type: secret
      name: keeperhub-shared
      key: INTERNAL_SERVICE_HMAC_SECRET
    AWS_REGION:
      type: template
      value: '{{ .Values.global.awsRegion }}'
    RECONCILE_INTERVAL_MS:
      type: kv
      value: "30000"
    # Force-reconnect each chain socket on this cadence, so a half-open upstream
    # websocket cannot silently stop delivering blocks.
    SOCKET_MAX_AGE_MS:
      type: kv
      value: "3600000"
    # One replica, so nothing has to acquire a lease before it starts work.
    LEADER_ELECTION_ENABLED:
      type: kv
      value: "false"
    HEALTH_PORT:
      type: kv
      value: "3000"

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

  serviceMonitors:
    enabled: false
  cronjob:
    enabled: false

# Off by default, because it is purely a Prometheus scrape target and a
# self-hosted install has nothing scraping it unless the operator brings their
# own Prometheus. The configuration below is complete for anyone who does.
metricsCollector:
  enabled: false
  replicaCount: 1

  image:
    repository: '{{ required "set global.image.repository - a registry the cluster can pull from" .Values.global.image.repository }}'
    tag: 'collector-{{ required "set global.image.tag - the bare version, each component adds its own prefix" .Values.global.image.tag }}'
    pullPolicy: '{{ .Values.global.image.pullPolicy }}'

  service:
    enabled: true
    name: keeperhub-metrics-collector
    type: ClusterIP
    port: 9090
    containerPort: 9090
    tls:
      enabled: false
  ingress:
    enabled: false

  # No command override. Startup comes from the Dockerfile CMD
  # (tsx keeperhub-metrics-collector/index.ts), which stays the single source.

  serviceAccount:
    create: true
    name: keeperhub-metrics-collector

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  env:
    DATABASE_URL:
      type: secret
      name: '{{ .Values.global.db.secretName }}'
      key: '{{ .Values.global.db.secretKey }}'
    PORT:
      type: kv
      value: "9090"
    METRICS_COLLECTOR:
      type: kv
      value: "prometheus"
    LOG_LEVEL:
      type: kv
      value: "info"

  livenessProbe:
    httpGet:
      path: /health
      port: 9090
    initialDelaySeconds: 20
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 9090
    initialDelaySeconds: 10
    periodSeconds: 10

  serviceMonitors:
    enabled: false
  cronjob:
    enabled: false
