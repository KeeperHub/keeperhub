# KeeperHub local deployment values
# Template variables: ${IMAGE_TAG} is replaced by deploy.sh

replicaCount: 1

image:
  repository: keeperhub
  tag: "${IMAGE_TAG}"
  pullPolicy: Never

service:
  enabled: true
  name: keeperhub
  port: 3000
  type: ClusterIP
  containerPort: 3000
  tls:
    enabled: false

ingress:
  enabled: false

deployment:
  enabled: true
  # NEEDS LIVE TEST - not yet validated against a real minikube deploy.
  # Pushes the schema to the local Postgres and seeds the shared internal-service
  # HMAC secret so the app can verify HMAC-signed requests from the local
  # dispatchers. Both lines tolerate failure so the initContainer never blocks
  # app startup (worst case the store stays unseeded, same as before).
  initContainers:
    - name: db-migrate-seed
      image: "keeperhub:${IMAGE_TAG}"
      imagePullPolicy: Never
      command: ["/bin/sh", "-c"]
      args:
        - |
          pnpm db:push || echo "db:push skipped"
          printf '%s' "$INTERNAL_SERVICE_HMAC_SECRET" | ALLOW_REMOTE=1 pnpm tsx scripts/seed-internal-service-hmac.ts || echo "internal-service HMAC seed skipped (row already present or seed unavailable)"
      env:
        DATABASE_URL:
          type: kv
          value: "postgresql://local:local@postgresql.local.svc.cluster.local:5432/keeperhub"
        INTERNAL_SERVICE_HMAC_SECRET:
          type: kv
          value: "bG9jYWwtZGV2LWludGVybmFsLXNlcnZpY2UtaG1hYzA="
        AGENTIC_WALLET_HMAC_KMS_KEY:
          type: kv
          value: "bG9jYWwtZGV2LWFnZW50aWMtd2FsbGV0LWhtYWMta3k="

serviceAccount:
  create: true
  name: keeperhub

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV:
    type: kv
    value: "development"
  # Enable Prometheus metrics
  METRICS_COLLECTOR:
    type: kv
    value: "prometheus"
  # Debug logging for observability
  DEBUG:
    type: kv
    value: "*"
  LOG_LEVEL:
    type: kv
    value: "debug"
  NODE_OPTIONS:
    type: kv
    value: "--enable-source-maps"
  DATABASE_URL:
    type: kv
    value: "postgresql://local:local@postgresql.local.svc.cluster.local:5432/keeperhub"
  BETTER_AUTH_SECRET:
    type: kv
    value: "local-dev-secret-change-in-production"
  OAUTH_JWT_SECRET:
    type: kv
    value: "local-dev-oauth-jwt-secret-change-in-production"
  MCP_SESSION_SECRET:
    type: kv
    value: "local-dev-mcp-session-secret-change-in-production"
  BETTER_AUTH_URL:
    type: kv
    value: "https://workflow.keeperhub.local"
  NEXT_PUBLIC_APP_URL:
    type: kv
    value: "https://workflow.keeperhub.local"
  # AI Configuration - Choose ONE based on your setup:
  # Option 1: AI Gateway API key
  AI_GATEWAY_API_KEY:
    type: kv
    value: ""
  # Option 2: Direct OpenAI API key
  OPENAI_API_KEY:
    type: kv
    value: ""
  # Option 3: Direct Anthropic API key
  ANTHROPIC_API_KEY:
    type: kv
    value: ""
  # AI_MODEL: Which model to use (default: gpt-4o)
  AI_MODEL:
    type: kv
    value: "gpt-4o"
  # Turnkey Wallet Configuration
  TURNKEY_API_PUBLIC_KEY:
    type: kv
    value: ""
  TURNKEY_API_PRIVATE_KEY:
    type: kv
    value: ""
  TURNKEY_ORGANIZATION_ID:
    type: kv
    value: ""
  # Encryption keys - set via environment variables before deploy
  INTEGRATION_ENCRYPTION_KEY:
    type: kv
    value: "${INTEGRATION_ENCRYPTION_KEY}"
  NEXT_PUBLIC_API_URL:
    type: kv
    value: "https://workflow.keeperhub.local"
  # Internal service-to-service auth (HMAC). Must match the secret seeded into
  # the local app's internal_service_hmac_secrets store and the value used by
  # the dispatchers/runner below.
  INTERNAL_SERVICE_HMAC_SECRET:
    type: kv
    value: "bG9jYWwtZGV2LWludGVybmFsLXNlcnZpY2UtaG1hYzA="
  # 32-byte base64 AES key the app uses to encrypt/decrypt the HMAC signing
  # secret in its internal_service_hmac_secrets store (needed to verify).
  AGENTIC_WALLET_HMAC_KMS_KEY:
    type: kv
    value: "bG9jYWwtZGV2LWFnZW50aWMtd2FsbGV0LWhtYWMta3k="

livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  tcpSocket:
    port: 3000

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 10
  tcpSocket:
    port: 3000

cronjob:
  enabled: true
  jobs:
    - name: execution-digest
      image:
        repository: keeperhub
        tag: "${IMAGE_TAG}"
        pullPolicy: Never
      schedule: "0 14 * * *" # daily 14:00 UTC; weekly digests are sent on Tuesdays
      command: ["/bin/sh"]
      args:
        - "/app/deploy/scripts/digest-cron.sh"
        - "http://keeperhub:3000/api/internal/execution-digest"
      env:
        INTERNAL_SERVICE_HMAC_SECRET:
          type: kv
          value: "bG9jYWwtZGV2LWludGVybmFsLXNlcnZpY2UtaG1hYzA="
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "32Mi"
          cpu: "10m"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      restartPolicy: OnFailure
      backoffLimit: 2
