# Solana Tracker for PR environments.
# Deployed only when the deploy-pr-events label is present: there is no
# solana-latest staging image to fall back to, so the deploy workflow builds
# solana-${sha_short} into the shared events ECR and sets SOLANA_IMAGE_TAG.
# Runs healthy but idle until Solana RPC/WSS is configured in chain-config -
# the pr-N chains table has none, so the mapper skips Solana chains and starts
# no ingestors (health stays 200: /healthz is healthy when no chains are
# registered).
# Variables to be replaced: ${PR_NUMBER}, ${ECR_REGISTRY}, ${SOLANA_IMAGE_TAG}

# Single-process reconciler: 2+ replicas would double-subscribe every chain
# WSS and double-dispatch SQS, so this must stay 1.
replicaCount: 1

service:
  enabled: true
  name: solana-pr-${PR_NUMBER}
  port: 3001
  type: ClusterIP
  containerPort: 3001
  tls:
    enabled: false

ingress:
  enabled: false

image:
  repository: ${ECR_REGISTRY}/keeperhub-event-staging
  tag: ${SOLANA_IMAGE_TAG}
  pullPolicy: Always

deployment:
  enabled: true

serviceAccount:
  create: false
  name: keeperhub-pr-${PR_NUMBER}

podAnnotations:
  reloader.stakater.com/auto: "true"

serviceMonitors:
  enabled: false

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

env:
  NODE_ENV:
    type: kv
    value: "production"
  LOG_LEVEL:
    type: kv
    value: "info"
  HEALTH_PORT:
    type: kv
    value: "3001"
  KEEPERHUB_API_URL:
    type: kv
    value: "http://keeperhub-pr-${PR_NUMBER}-common:3000"
  INTERNAL_SERVICE_HMAC_SECRET:
    type: parameterStore
    name: internal-service-hmac-secret
    parameter_name: /eks/techops-staging/keeperhub/internal-service-hmac-secret
  REDIS_HOST:
    type: kv
    value: "redis.pr-${PR_NUMBER}.svc.cluster.local"
  REDIS_PORT:
    type: kv
    value: "6379"
  REDIS_PASSWORD:
    type: kv
    value: ""
  SQS_QUEUE_URL:
    type: kv
    value: "http://localstack.pr-${PR_NUMBER}.svc.cluster.local:4566/000000000000/keeperhub-workflow-queue"
  AWS_REGION:
    type: kv
    value: "us-east-1"
  # Route all AWS calls (SQS send + STS credential resolution) at localstack.
  # Without this the SDK resolves creds via STS AssumeRoleWithWebIdentity
  # against real AWS and is denied, so the enqueue fails. localstack emulates
  # STS and returns usable creds. Matches the block/schedule/executor templates.
  AWS_ENDPOINT_URL:
    type: kv
    value: "http://localstack.pr-${PR_NUMBER}.svc.cluster.local:4566"

externalSecrets:
  clusterSecretStoreName: techops-staging

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
  httpGet:
    path: /healthz
    port: 3001
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  httpGet:
    path: /healthz
    port: 3001
