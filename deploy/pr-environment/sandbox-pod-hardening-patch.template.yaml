# Strategic-merge patch template for the per-PR keeperhub-sandbox
# Deployment. Layered on after `helm upgrade` to cover the two things
# the techops-services/common@0.2.1 chart does not expose:
#
# Variables substituted by envsubst at deploy time: ${PR_NUMBER}
#
# 1. automountServiceAccountToken: false at the Pod-spec level.
#    SA-level `automountServiceAccountToken: false` from
#    sandbox-sa.template.yaml is sufficient for new Pods to skip the
#    token projection. Setting it at BOTH SA AND Pod level closes the
#    "an annotation on the Pod overrides the SA default" loophole and
#    makes the WORK-03 regression assertion (no token file inside the
#    Pod) deterministic.
#
# 2. emptyDir.medium: Memory on the tmp volume. The chart's template
#    only renders `sizeLimit` on emptyDir volumes, so the underlying
#    storage defaults to node disk. Forcing the medium to Memory means
#    the writable surface that survives readOnlyRootFilesystem:true is
#    a non-persistent in-memory tmpfs - no ELF payload an attacker
#    drops there will outlive the Pod.
#
# Apply AFTER `helm upgrade` with:
#   envsubst < deploy/pr-environment/sandbox-pod-hardening-patch.template.yaml \
#     | kubectl -n pr-${PR_NUMBER} patch deployment \
#       keeperhub-sandbox-pr-${PR_NUMBER}-common --patch-file /dev/stdin
#
# CRITICAL: the volumes[].name below must exactly match the chart-rendered
# volume name. Strategic merge keys on `name`; on a mismatch it APPENDS a
# new orphan volume rather than overlaying medium: Memory, and the chart's
# original disk-backed emptyDir wins for the /tmp mount. The deploy-pr-
# environment.yaml workflow's sandbox subshell runs a kubectl-get
# jsonpath assertion after the patch to catch this; if a chart upgrade
# changes the fullname template, this file AND that assertion must move
# in lockstep.
spec:
  template:
    spec:
      automountServiceAccountToken: false
      # Volume name is generated by the chart as <fullname>-<volume.name>-volume,
      # where fullname is the release name plus chart name ("common"). The
      # release name is "keeperhub-sandbox-pr-${PR_NUMBER}" so the rendered
      # name is "keeperhub-sandbox-pr-${PR_NUMBER}-common-tmp-volume".
      # Strategic merge uses `name` as the merge key on the volumes list,
      # so this patch overlays the medium field onto the existing entry
      # rather than appending a second volume.
      volumes:
        - name: keeperhub-sandbox-pr-${PR_NUMBER}-common-tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
