replicaCount: 1

service:
  enabled: true
  name: keeperhub-docs-staging
  port: 3000
  type: ClusterIP
  containerPort: 3000
  tls:
    enabled: true
    issuerName: cloudflare

ingress:
  enabled: true
  hosts:
    - migration-docs-staging.keeperhub.com
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: traefik-cloudflare-origin-pull@kubernetescrd

httpWwwRedirect:
  enabled: false
httpBasicAuth:
  enabled: false

image:
  repository: ${ECR_REGISTRY}/keeperhub-docs-staging
  tag: ${IMAGE_TAG}
  pullPolicy: Always

deployment:
  enabled: true

serviceAccount:
  create: false

podAnnotations:
  reloader.stakater.com/auto: "true"

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

env:
  NODE_ENV:
    type: kv
    value: "production"
  HOSTNAME:
    type: kv
    value: "0.0.0.0"

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 30
  httpGet:
    path: /
    port: 3000
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 30
  httpGet:
    path: /
    port: 3000
