# Solana ingestion service (event + block triggers). Single-process reconciler:
# 2+ replicas would subscribe to every chain WSS twice and dispatch duplicate
# SQS messages, so this must stay 1.
#
# Reuses the event-tracker's service account (keeperhub-events-prod) + IRSA
# role, Redis, and workflow queue - Solana ingestion has the same access needs
# as the EVM event tracker, so no new AWS resources are required. Runs healthy
# but idle until a Solana chain (101/103) with primary RPC + WSS is configured
# in chain-config; the mapper skips chains without WSS and starts no ingestors.
replicaCount: 1

service:
  enabled: true
  name: keeperhub-solana-prod
  port: 3001
  type: ClusterIP
  containerPort: 3001
  tls:
    enabled: false

ingress:
  enabled: false

image:
  repository: ${ECR_REGISTRY}/keeperhub-event-prod
  tag: solana-${IMAGE_TAG}
  pullPolicy: Always

deployment:
  enabled: true

# Reuse the event-tracker service account + IRSA role (created by the
# keeperhub-event release). create: false so this release only references it -
# no new IAM role is provisioned for Solana.
serviceAccount:
  create: false
  name: keeperhub-events-prod

podAnnotations:
  reloader.stakater.com/auto: "true"

# Prod Alloy scrapes via ServiceMonitor CRDs, not prometheus.io/* annotations -
# the same pattern block.serviceMonitors uses in deploy/keeperhub-stack. Without
# this the /metrics endpoint on the health port is never scraped, the
# keeperhub_solana_tracker_* series do not exist, and the Solana Grafana alerts
# stay blind. That matters more than usual here: those alerts are the deliberate
# replacement for the pod-restart signal the probe change above removes.
# `port: http` is the chart's name for the single service port when
# service.port is set.
serviceMonitors:
  enabled: true
  monitors:
    - name: solana-tracker-metrics
      port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 150m
    memory: 256Mi

env:
  NODE_ENV:
    type: kv
    value: "production"
  LOG_LEVEL:
    type: kv
    value: "info"
  HEALTH_PORT:
    type: kv
    value: "3001"
  KEEPERHUB_API_URL:
    type: kv
    value: "http://keeperhub-common:3000"
  INTERNAL_SERVICE_HMAC_SECRET:
    type: parameterStore
    name: internal-service-hmac-secret
    parameter_name: /eks/techops-prod/keeperhub/internal-service-hmac-secret
  REDIS_HOST:
    type: parameterStore
    name: redis-host
    parameter_name: /eks/techops-prod/keeperhub-events/redis-host
  REDIS_PORT:
    type: parameterStore
    name: redis-port
    parameter_name: /eks/techops-prod/keeperhub-events/redis-port
  REDIS_PASSWORD:
    type: parameterStore
    name: redis-password
    parameter_name: /eks/techops-prod/keeperhub-events/redis-password
  SQS_QUEUE_URL:
    type: kv
    value: "https://sqs.us-east-2.amazonaws.com/${AWS_ACCOUNT_ID}/keeperhub-workflow-queue-prod"
  AWS_REGION:
    type: kv
    value: "us-east-2"

externalSecrets:
  clusterSecretStoreName: techops-prod

# Both probes point at /livez, which reports process liveness only and never
# reads chain state. /healthz returns 503 whenever ANY chain is degraded, so
# when it backed the liveness probe a single silent Solana endpoint restarted
# the whole pod and took the healthy chains down with it. /healthz is still
# served, as the human diagnostic; nothing acts on it automatically.
#
# Readiness moves too, and not only for symmetry: this release deploys with
# helm --atomic, so a chain degraded at rollout time would leave the new pod
# permanently NotReady and roll the release back - a bad upstream blocking
# deploys. Per-chain health is carried by the metrics below instead.
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
  httpGet:
    path: /livez
    port: 3001
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  httpGet:
    path: /livez
    port: 3001
