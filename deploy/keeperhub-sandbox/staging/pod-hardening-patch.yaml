# Strategic-merge patch for the keeperhub-sandbox Deployment in the
# staging cluster. Layered on after `helm upgrade` to cover the two
# things the techops-services/common@0.2.1 chart does not expose:
#
# 1. automountServiceAccountToken: false at the Pod-spec level.
#    SA-level `automountServiceAccountToken: false` from sa.yaml is
#    sufficient for new Pods to skip the token projection. Setting it
#    at BOTH SA AND Pod level closes the "an annotation on the Pod
#    overrides the SA default" loophole and makes the WORK-03
#    regression assertion (no token file inside the Pod) deterministic.
#
# 2. emptyDir.medium: Memory on the tmp volume. The chart's template
#    only renders `sizeLimit` on emptyDir volumes, so the underlying
#    storage defaults to node disk. Forcing the medium to Memory means
#    the writable surface that survives readOnlyRootFilesystem:true is
#    a non-persistent in-memory tmpfs - no ELF payload an attacker
#    drops there will outlive the Pod.
#
# Apply AFTER `helm upgrade` with:
#   kubectl -n keeperhub patch deployment keeperhub-sandbox-common \
#     --patch-file deploy/keeperhub-sandbox/staging/pod-hardening-patch.yaml
#
# Verify with:
#   kubectl -n keeperhub get deployment keeperhub-sandbox-common \
#     -o jsonpath='{.spec.template.spec.automountServiceAccountToken}'
#   # Expected output: false
#
#   kubectl -n keeperhub get deployment keeperhub-sandbox-common \
#     -o jsonpath='{.spec.template.spec.volumes[?(@.name=="keeperhub-sandbox-common-tmp-volume")].emptyDir.medium}'
#   # Expected output: Memory
spec:
  template:
    spec:
      automountServiceAccountToken: false
      # Volume name is generated by the chart as <fullname>-<volume.name>-volume,
      # where fullname is the release name plus chart name ("common"). The
      # release name is "keeperhub-sandbox" so the rendered name is
      # "keeperhub-sandbox-common-tmp-volume". Strategic merge uses `name`
      # as the merge key on the volumes list, so this patch overlays the
      # medium field onto the existing entry rather than appending a
      # second volume.
      volumes:
        - name: keeperhub-sandbox-common-tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
